<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <title>Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="../comun/casa.js?v=10"></script>
  <script>
    // Casa: sin acceso, la sección no existe para esta persona; vuelve a la portada.
    if (Casa.permiso('notes') === 'ninguno') location.replace(Casa.RAIZ);
    // Notes tiene su propio estilo: no se aplica el tema de Casa.
    document.documentElement.removeAttribute('data-theme');
  </script>
  <style>
    /* Casa: aviso de conexión y modo solo lectura */
    .casa-aviso { margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45;
      text-align: center; background: rgba(127, 127, 127, .16); }
    .casa-aviso a { color: inherit; font-weight: 700; }
    body.solo-ver .bottom-nav .fab,
    body.solo-ver .bottom-nav a[data-tab="crear"],
    body.solo-ver .file-btn { display: none !important; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="bottom-nav" id="nav" aria-label="Navegación principal">
    <div class="tabs">
      <a href="#/crear" data-tab="crear"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Crear</span></a>
      <a href="#/notas" data-tab="notas"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg><span>Notas</span></a>
      <a href="#/libretas" data-tab="libretas"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Libretas</span></a>
      <a href="#/mas" data-tab="mas"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Más</span></a>
    </div>
    <button class="fab" data-new="note" aria-label="Nota rápida"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg></button>
  </nav>

  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <input id="dlg-input" required maxlength="80">
      <div class="dlg-actions">
        <button value="cancel" formnovalidate>Cancelar</button>
        <button value="ok" class="primary">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script>
    // Casa: aviso de conexión o de solo lectura, fuera de #app para que no lo borre el repintado.
    (function () {
      var c = Casa.conexion(), p = Casa.permiso('notes'), html = '';
      if (!(c.url && c.clave)) html = 'Este dispositivo no está conectado. <a href="../ajustes/">Conéctalo en Ajustes de Casa</a> con tu clave.';
      else if (p === 'ver') {
        document.body.classList.add('solo-ver');
        html = 'Modo solo lectura: puedes ver las notas, pero los cambios no se guardan en Google.';
        if (/^#\/crear/.test(location.hash) || !location.hash) location.replace('#/notas');
      }
      if (!html) return;
      var el = document.createElement('p');
      el.className = 'casa-aviso';
      el.innerHTML = html;
      document.body.insertBefore(el, document.getElementById('app'));
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
