<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="comun/estilo.css?v=9">
<script src="comun/casa.js?v=9"></script>
<style>
/* Tamaño de cada círculo según cuántas secciones hay: cuantas menos, más grandes,
   siempre sin hacer scroll en un móvil. Con número impar, la última va centrada. */
.grid { --size: min(36vw, 150px, 16svh); }
.grid[data-n="1"] { --size: min(62vw, 240px, 36svh); grid-template-columns: minmax(0, 1fr); }
.grid[data-n="2"] { --size: min(40vw, 200px, 30svh); }
.grid[data-n="3"], .grid[data-n="4"] { --size: min(38vw, 180px, 24svh); }
@supports not (height: 1svh) {
  .grid { --size: min(36vw, 150px, 16vh); }
  .grid[data-n="1"] { --size: min(62vw, 240px, 36vh); }
  .grid[data-n="2"] { --size: min(40vw, 200px, 30vh); }
  .grid[data-n="3"], .grid[data-n="4"] { --size: min(38vw, 180px, 24vh); }
}
.grid { align-content: center; }
.grid li:last-child:nth-child(odd) { grid-column: 1 / -1; }
.grid:not([data-n="5"]):not([data-n="6"]) .name { font-size: clamp(16px, 4.6vw, 21px); }

body {
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
}

main {
  max-width: 520px; margin: 0 auto; display: grid; gap: clamp(20px, 3.5svh, 32px); position: relative;
  /* Las secciones ocupan el centro de la pantalla, entre el título y la fecha */
  min-height: calc(100svh - 2 * max(28px, env(safe-area-inset-top, 0px)));
  grid-template-rows: auto 1fr auto;
}

header { text-align: center; display: grid; gap: 4px; }
.saludo { font-size: 15px; color: var(--muted); letter-spacing: .02em; }
h1 { margin: 0; font-weight: 800; font-size: clamp(36px, 8vw, 52px); line-height: 1; letter-spacing: -.01em; }

.ajustes {
  position: absolute; top: 0; right: 0;
  display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  font-size: 20px; text-decoration: none; color: var(--fg);
  border: 1.5px solid var(--line); background: var(--card);
  transition: transform .3s ease;
}
.ajustes:hover, .ajustes:focus-visible { transform: rotate(45deg); outline: none; border-color: var(--muted); }

.grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(14px, 2.5svh, 28px) clamp(16px, 5vw, 40px);
  list-style: none; margin: 0; padding: 0;
}

.item {
  display: grid; justify-items: center; gap: 10px;
  text-decoration: none; color: inherit; border-radius: 24px; outline: none;
}
.circle {
  width: var(--size); aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: var(--f); font-size: calc(var(--size) * .42); line-height: 1;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--r) 30%, transparent);
  transition: transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .3s ease;
}
.name {
  font-size: clamp(15px, 4vw, 18px); font-weight: 800; color: var(--r);
  text-align: center; text-wrap: balance; line-height: 1.2;
}
a.item:hover .circle,
a.item:focus-visible .circle {
  transform: scale(1.06);
  box-shadow: inset 0 0 0 3px var(--r), 0 12px 30px -10px color-mix(in srgb, var(--r) 60%, transparent);
}
a.item:focus-visible .name { text-decoration: underline; text-underline-offset: 4px; }

.solo-ver {
  font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--r); border: 1.5px solid var(--r); border-radius: 999px; padding: 2px 8px; margin-top: -4px;
}

footer { text-align: center; font-size: 13px; color: var(--muted); }
.sin-secciones { align-self: center; text-align: center; color: var(--muted); font-size: 16px; line-height: 1.5; margin: 24px auto; max-width: 30ch; }
</style>
</head>
<body>
  <main>
    <a class="ajustes" href="ajustes/" aria-label="Ajustes" title="Ajustes">⚙️</a>
    <header>
      <span class="saludo" id="saludo">Hola</span>
      <h1>Casa</h1>
    </header>

    <ul class="grid" id="grid"></ul>
    <p class="sin-secciones" id="sin-secciones" hidden>Todavía no tienes acceso a ninguna sección. Cuando te lo den, aparecerán aquí.</p>

    <footer id="fecha"></footer>
  </main>

<script>
  const prefs = Casa.preferencias();

  const h = new Date().getHours();
  const saludo = h < 6 ? 'Buenas noches' : h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
  document.getElementById('saludo').textContent = prefs.nombre ? saludo + ', ' + prefs.nombre : saludo;
  const f = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);

  const grid = document.getElementById('grid');
  // Solo las secciones con acceso y que no se han ocultado en Ajustes.
  const visibles = prefs.orden.filter(function (id) {
    return prefs.ocultas.indexOf(id) < 0 && Casa.tieneAcceso(id);
  });
  grid.dataset.n = visibles.length;
  grid.hidden = visibles.length === 0;
  document.getElementById('sin-secciones').hidden = visibles.length > 0;
  visibles.forEach(function (id) {
    const s = Casa.SECCIONES.find(function (x) { return x.id === id; });
    const li = document.createElement('li');
    li.className = 's-' + s.id;
    const el = document.createElement('a');
    el.className = 'item';
    el.href = s.href;
    el.innerHTML = '<span class="circle" aria-hidden="true">' + s.emoji + '</span>';
    const nombre = document.createElement('span');
    nombre.className = 'name';
    nombre.textContent = s.nombre;
    el.appendChild(nombre);
    if (Casa.permiso(id) === 'ver') {
      const b = document.createElement('span');
      b.className = 'solo-ver';
      b.textContent = 'Solo ver';
      el.appendChild(b);
    }
    li.appendChild(el);
    grid.appendChild(li);
  });
</script>
</body>
</html>
